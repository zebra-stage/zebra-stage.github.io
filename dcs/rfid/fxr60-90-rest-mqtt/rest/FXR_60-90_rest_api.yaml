        This endpoint requires:


        - `operation` — `add`, `delete`, `enable`, or `disable`

        - `profileNickName`


        Also send `activationID` when `operation` is `add`. Omit it for `enable`, `disable`, and `delete`.


        Supported on FXR90 only.


        ## 2. Endpoint Details


