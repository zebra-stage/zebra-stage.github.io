  /cloud/displayConfig:
    get:
      tags:
      - Display
      summary: Retrieves display configuration
      description: '## 1. Description


        > **FXR60 only.** Display APIs are not available on FXR90.


        The `GET /cloud/displayConfig` REST endpoint retrieves the active display configuration.


        This endpoint returns:


        - `enable` — whether the display is on

        - `enableOnscreenKeyboard` — whether the on-screen keyboard is on

        - `startUrl` — URL loaded on the display

        - `resolution` — active resolution string in `<width>x<height>` format

        - `screenTimeoutSec` — idle timeout in seconds

        - `orientation` — `landscape`, `portrait`, `landscape-flipped`, or `portrait-flipped`

        - `keyboardLayout` — `English-US`, `English-UK`, `German`, `Spanish`, `Italian`, `French`, `Brazilian`, `Swedish`, or `Japanese`


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_displayConfig` |

        | Pattern Name | Display Configuration Query |

        | REST Endpoint | `GET /cloud/displayConfig` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve active display configuration |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/displayConfig` to:


        - Read the settings last applied with `PUT /cloud/displayConfig`

        - Confirm enable, URL, resolution, orientation, and keyboard layout

        '
      operationId: getDisplayConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDisplayConfigResponse'
              example:
                enable: true
                enableOnscreenKeyboard: true
                keyboardLayout: English-US
                orientation: landscape
                resolution: 1920x1080
                screenTimeoutSec: 0
                startUrl: https://localhost/
      security:
      - bearerAuth: []
    put:
      tags:
      - Display
      summary: Sets display configuration
      description: '## 1. Description


        > **FXR60 only.** Display APIs are not available on FXR90.


        The `PUT /cloud/displayConfig` REST endpoint sets the display configuration.


        This endpoint sends:


        - `enable` — `true` turns the display on, `false` turns it off

        - `enableOnscreenKeyboard` — on-screen keyboard

        - `startUrl` — URL opened when the display is enabled

        - `resolution` — display size as `<width>x<height>`

        - `screenTimeoutSec` — idle timeout in seconds (`0` keeps the screen on; maximum `3600`)

        - `orientation` — `landscape`, `portrait`, `landscape-flipped`, or `portrait-flipped`

        - `keyboardLayout` — `English-US`, `English-UK`, `German`, `Spanish`, `Italian`, `French`, `Brazilian`, `Swedish`, or `Japanese`


        Omitted fields keep their current values.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_displayConfig` |

        | Pattern Name | Display Configuration |

        | REST Endpoint | `PUT /cloud/displayConfig` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |


        ## 3. Before You Begin


        Decide the display settings to send. Use the JSON field names below.


        | Field | What to set |

        |---|---|

        | `enable` | `true` to turn the display on, `false` to turn it off. |

        | `enableOnscreenKeyboard` | `true` to show the on-screen keyboard, `false` to hide it. |

        | `startUrl` | Page the display opens, for example `https://localhost/`. |

        | `resolution` | Confirms whether the resolution string matches the expected `<width>x<height>` dimensions, for example `1920x1080`. Use `GET /cloud/inputOutputDevices` to read supported values. |

        | `screenTimeoutSec` | Idle time in seconds before the screen sleeps. `0` keeps it on. Maximum `3600`. |

        | `orientation` | `landscape`, `portrait`, `landscape-flipped`, or `portrait-flipped`. |

        | `keyboardLayout` | `English-US`, `English-UK`, `German`, `Spanish`, `Italian`, `French`, `Brazilian`, `Swedish`, or `Japanese`. |

        '
      operationId: setDisplayConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDisplayConfigRequest'
            examples:
              flipped_orientation:
                summary: Enable and flip orientation
                value:
                  enable: true
                  orientation: landscape-flipped
              landscape_japanese:
                summary: Landscape, Japanese, 1920x1080
                value:
                  enable: true
                  enableOnscreenKeyboard: true
                  startUrl: https://localhost/
                  resolution: 1920x1080
                  orientation: landscape
                  screenTimeoutSec: 300
                  keyboardLayout: Japanese
              portrait_german:
                summary: Portrait, German, 1280x720
                value:
                  enable: true
                  enableOnscreenKeyboard: false
                  startUrl: https://192.0.2.10/
                  resolution: 1280x720
                  orientation: portrait
                  screenTimeoutSec: 0
                  keyboardLayout: German
              success:
                summary: Empty object on success
                value: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetDisplayConfigResponse'
      security:
      - bearerAuth: []
  /cloud/inputOutputDevices:
    get:
      tags:
      - Display
      summary: Retrieves input/output device information
      description: '## 1. Description


        > **FXR60 only.** Display APIs are not available on FXR90.


        The `GET /cloud/inputOutputDevices` REST endpoint retrieves the connection status and capabilities of devices attached to the reader.


        Peripheral and monitor details are documented in the response schema and in the key fields table below.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_inputOutputDevices` |

        | Pattern Name | Input/Output Devices Query |

        | REST Endpoint | `GET /cloud/inputOutputDevices` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve attached keyboard, mouse, touch, and monitor status |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/inputOutputDevices` to:


        - Confirm which peripherals are connected before changing display settings

        - Read supported monitor resolutions before `PUT /cloud/displayConfig`


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `monitor.connected` | Is a monitor attached? | Display APIs apply only when a monitor is present. |

        | `monitor.supportedResolutions` | Which resolutions are supported? | List of resolutions supported by the monitor hardware. Use these values in `PUT /cloud/displayConfig`. |

        | `monitor.currentResolution` | What resolution is active? | Confirms the current `<width>x<height>` string. |

        | `monitor.screenActive` | Is the panel awake? | `true` when the display is on; `false` when sleeping. |

        '
      operationId: getInputOutputDevices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInputOutputDevicesResponse'
              example:
                keyboard:
                  keyboardLayout: English-US
                  status: disconnected
                monitor:
                  details:
                  - currentResolution: 1920x1080
                    manufacturer: MST
                    model: XENARC
                    orientation: landscape
                    screenActive: true
                    supportedResolutions:
                    - 1280x720
                    - 1920x1080
                    - 1024x768
                    - 800x600
                    - 720x576
                    - 720x480
                    - 640x480
                  status: connected
                mouse:
                  status: disconnected
                touch:
                  status: disconnected
      security:
      - bearerAuth: []
