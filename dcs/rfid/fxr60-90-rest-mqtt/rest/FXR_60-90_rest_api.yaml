  /cloud/pass-through:
    put:
      tags:
      - System
      summary: Pass-through command
      description: '## 1. Description


        The `PUT /cloud/pass-through` REST endpoint sends a command to a reader component, bypassing the standard API layer.


        This endpoint sends:


        - The target component through `component`

        - The command string for that component through `payload`


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_passthru` |

        | Pattern Name | Pass-Through Command |

        | REST Endpoint | `PUT /cloud/pass-through` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Required Request Fields | `component`, `payload` |

        | Supported Components | `RC` (Radio Control) |


        ## 3. Before You Begin


        | What You Need | Details |

        |---|---|

        | Component | Currently `RC` (Radio Control). |

        | Payload | For `RC`: `mode` or `status`. |

        '
      operationId: setPassthru
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassthruRequest'
            examples:
              mode:
                summary: Passthrough mode query
                value:
                  component: RC
                  payload: mode
              mode_success:
                summary: Mode response
                value:
                  response: 'Success: {"antennaStopCondition":{"type":"DURATION","value":100},"delayBetweenAntennaCycles":{"duration":0,"type":"DISABLED"},"linkProfile":3,"query":{"session":"S0","tagPopulation":256,"target":"AB"},"reportFilter":{"duration":0,"type":"PER_ANTENNA"},"tagMetaData":["ANTENNA","RSSI","CHANNEL","PC","XPC","CRC","SEEN_COUNT","PHASE"],"transmitPower":[30.0,30.0,30.0,30.0,30.0,30.0],"type":"CUSTOM"}'
              status:
                summary: Passthrough status query
                value:
                  component: RC
                  payload: status
              status_success:
                summary: Status response
                value:
                  response: 'Success: {"numTagReads": 8034512,"numTagReadsPerAntenna": {"1": 8034512,"2": 0,"3": 0,"4": 0},"numRadioPacketsRxed": 12131354,"numDataMessagesTxed": 8034512,"cpuUtilization": 0.0,"ramUtilization": 1.0,"uptime": "140:56:48","numErrors": 9313,"numWarnings": 20,"radioConnection": "connected","radioActivity": "active","antennas": {"1": "disconnected","2": "disconnected","3": "connected","4": "disconnected"},"temperature": {"ambient":33,"pa":30},"impinjGen2X": {"isActive": false,"feature": "none"}}'
