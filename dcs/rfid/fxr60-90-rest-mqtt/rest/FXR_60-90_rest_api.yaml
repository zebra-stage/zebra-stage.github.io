  /cloud/wifiNetworks:
    get:
      tags:
      - Network
      summary: Retrieves available Wi-Fi networks
      description: '## 1. Description


        The `GET /cloud/wifiNetworks` REST endpoint retrieves visible Wi-Fi networks.


        This endpoint returns `availableWifiNetworks`. Each item has:


        - `essid`

        - `signalStrength`

        - `capabilities`

        - `configuration` — `autoConnect` and optional `security`


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_availableWifiNetworks` |

        | Pattern Name | Wi-Fi Site Survey |

        | REST Endpoint | `GET /cloud/wifiNetworks` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve visible Wi-Fi networks |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/wifiNetworks` to:


        - Read `essid`, `signalStrength`, `capabilities`, and `configuration`


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `essid` | Which network is this? | The broadcast SSID name shown to users when choosing a network. |

        | `signalStrength` | Is the signal strong enough to connect? | Reported as a percentage; low values mean an unreliable connection. |

        | `capabilities` | What security modes does the access point advertise? | Array of strings such as `WPA2`, `WPA2-802.1X`, `WPA3`, `WPA3-802.1X`. Confirms which authentication methods the reader can use to join. |

        | `configuration.autoConnect` | Is the reader set to join this network automatically? | `true` means the reader connects to this network without manual action. |

        | `configuration.security` | What credentials are configured for this network? | Present only when security settings have been saved for this `essid`. Includes `type` (security mode) and, for enterprise modes, `details` (`auth`, `innerAuth`, `username`, `password`, `cert`). |

        '
      operationId: getAvailablewifinetworks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAvailablewifinetworksResponse'
              example:
                availableWifiNetworks:
                - capabilities:
                  - WPA2
                  configuration:
                    autoConnect: true
                    security:
                      details:
                        password: '********'
                      type: WPA2Personal
                  essid: EXAMPLE_WIFI_2.4_5_WPA2
                  signalStrength: 87%
                - capabilities:
                  - WPA2
                  configuration:
                    autoConnect: false
                  essid: EXAMPLE_WIFI_2.4_WPA3
                  signalStrength: 89%
                - capabilities:
                  - WPA2-802.1X
                  configuration:
                    autoConnect: false
                  essid: Example_WiFi_WPA2_24_5_ENT_802.1x
                  signalStrength: 89%
                - capabilities:
                  - WPA2
                  configuration:
                    autoConnect: false
                  essid: EXAMPLE_WIFI_FAST_ROAMING_24
                  signalStrength: 89%
                - capabilities:
                  - WPA2
                  configuration:
                    autoConnect: false
                  essid: EXAMPLE_WIFI_2.4_WPA2
                  signalStrength: 87%
                - capabilities:
                  - WPA2-802.1X
                  configuration:
                    autoConnect: false
                  essid: Example_WiFi_WPA2_24_5_ENT_SHA256
                  signalStrength: 87%
                - capabilities:
                  - WPA2-802.1X
                  configuration:
                    autoConnect: false
                  essid: Example_WiFi_WPA2_2_4_ENT_802.1x
                  signalStrength: 87%
                - capabilities:
                  - WPA2-802.1X
                  configuration:
                    autoConnect: false
                  essid: Example_WiFi_WPA2_24_ENT_SHA256
                  signalStrength: 87%
                - capabilities:
                  - WPA3-802.1X
                  configuration:
                    autoConnect: false
                  essid: EXAMPLE_WIFI_WPA3_ENT_SUITE192
                  signalStrength: 87%
                - capabilities:
                  - WPA3
                  configuration:
                    autoConnect: false
                  essid: EXAMPLE_WIFI_2.4_5_WPA3
                  signalStrength: 85%
                - capabilities:
                  - WPA2
                  configuration:
                    autoConnect: false
                  essid: EXAMPLE_WIFI_FAST_ROAMING_5
                  signalStrength: 69%
                - capabilities:
                  - WPA2
                  configuration:
                    autoConnect: false
                  essid: EXAMPLE_WIFI_5_WPA2
                  signalStrength: 69%
                - capabilities:
                  - WPA2-802.1X
                  configuration:
                    autoConnect: false
                  essid: Example_WiFi_WPA2_5_ENT_802.1x
                  signalStrength: 69%
                - capabilities:
                  - WPA2-802.1X
                  configuration:
                    autoConnect: false
                  essid: Example_WiFi_WPA2_5_ENT_SHA256
                  signalStrength: 69%
      security:
