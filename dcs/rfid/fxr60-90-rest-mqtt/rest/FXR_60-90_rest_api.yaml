  /cloud/logs:
    get:
      tags:
      - Logs
      summary: Retrieves reader log configuration
      description: '## 1. Description


        The `GET /cloud/logs` REST endpoint retrieves the current log configuration.


        This endpoint returns:


        - `radioPacketLog` — `true` or `false`

        - `components` — `componentName` and `level` for `radio_control` and `reader_gateway`


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_logs` |

        | Pattern Name | Log Configuration Query |

        | REST Endpoint | `GET /cloud/logs` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve log configuration |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/logs` to:


        - Read `radioPacketLog` and component levels after `PUT /cloud/logs`

        '
      operationId: getLogs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logLevel.v1'
              example:
                components:
                - componentName: radio_control
                  level: INFO
                - componentName: reader_gateway
                  level: INFO
                radioPacketLog: false
      security:
      - bearerAuth: []
    put:
      tags:
      - Logs
      summary: Updates reader log configuration
      description: '## 1. Description


        The `PUT /cloud/logs` REST endpoint sets log configuration.


        This endpoint sends:


        - `radioPacketLog` — `true` or `false`

        - `components` — optional array of `componentName` and `level`


        To set a component level, send `reader_gateway` or `radio_control` as the component name (`RG` is also accepted as an alias for `reader_gateway`). Send one of the valid levels — `OFF`, `FATAL`, `ERROR`, `WARNING`, `INFO`, `DEBUG`, `TRACE`, or `EXTRA`.


        If `radioPacketLog` is omitted, the reader defaults it to `false`.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_logs` |

        | Pattern Name | Log Configuration |

        | REST Endpoint | `PUT /cloud/logs` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |


        ## 3. Before You Begin


        Decide `radioPacketLog` and any component level. Use the JSON field names below.


        | Field | What to set |

        |---|---|

        | `radioPacketLog` | `true` to capture radio packets, `false` to stop. Include this field on every `PUT /cloud/logs` request. |

        | `componentName` | `reader_gateway`, `radio_control`, or `RG` (alias for `reader_gateway`). |

        | `level` | `OFF`, `FATAL`, `ERROR`, `WARNING`, `INFO`, `DEBUG`, `TRACE`, or `EXTRA`. |

        '
      operationId: setLogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/logLevel.v1'
            examples:
              radio_packet_log_on:
                summary: Enable radioPacketLog
                value:
                  radioPacketLog: true
              rg_debug_packet_on:
                summary: reader_gateway DEBUG and radioPacketLog on
                value:
                  components:
                  - componentName: reader_gateway
                    level: DEBUG
                  radioPacketLog: true
              success:
                summary: Empty string on success
                value: ''
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLogsResponse'
      security:
      - bearerAuth: []
