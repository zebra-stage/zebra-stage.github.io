    put:
      tags:
      - Control
      summary: Updates the reader's operating mode
      description: '## 1. Description


        The `PUT /cloud/mode` REST endpoint configures the reader''s operating mode.


        This call **replaces the entire mode configuration**. Fields you omit are not kept from the previous mode — send the full object you want the reader to use.


        This endpoint allows you to configure:


        - The operating mode type through `type`

        - Antenna port selection and transmit power through `antennas` and `transmitPower`

        - The RF environment profile through `environment`

        - Inventory stop behavior through `antennaStopCondition`

        - Gen2 query, select, and access settings

        - Report filtering, RSSI filtering, and metadata options


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_mode` |

        | Pattern Name | Operating Mode Configuration |

        | REST Endpoint | `PUT /cloud/mode` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Supported Mode Types | `SIMPLE`, `INVENTORY`, `PORTAL`, `CONVEYOR`, `CUSTOM` |

        | Supported Environment Profiles | `LOW_INTERFERENCE`, `HIGH_INTERFERENCE`, `VERY_HIGH_INTERFERENCE`, `AUTO_DETECT`, `DEMO` |


        ## 3. Before You Begin


        Decide on your mode configuration before sending this request. Changing mode while inventory is active can disrupt reads — call `PUT /cloud/stop` first if the reader is currently reading.


        | What You Need | Details |

        |---|---|

        | Mode type | One of `SIMPLE`, `INVENTORY`, `PORTAL`, `CONVEYOR`, or `CUSTOM`. |

        | Antenna ports and power | Which antenna ports to enable, and transmit power in **dBm** (0.0–30.0). |

        | Environment profile | Optional. Set to match the RF environment. Use `AUTO_DETECT` if unsure. Default is `HIGH_INTERFERENCE`. |

        | Mode-specific settings | Inventory interval for `INVENTORY`; GPI trigger (`port` 1–4) and stop interval for `PORTAL`. Include only the sub-object for the chosen type. |

        | Gen2 and reporting | Query, selects, optional accesses (`wordCount`, not `wordCounter`), metadata (`READERLOCATION`), report filter, RSSI filter, and radio start/stop conditions. |


        ## 4. Operating Modes


        ### SIMPLE


        `SIMPLE` mode reads and reports every unique tag in the radio''s field of view.


        By default, the reader:

        - Reads tags on all antenna ports. Use `antennas` to select specific ports.

        - Reports all unique tags. Use `filter` to restrict which tags are reported.


        ### INVENTORY


        `INVENTORY` mode reads tags and reports every unique tag for each antenna at a periodic interval. Each report also includes metadata such as peak RSSI and the number of reads recorded for the antenna during the interval.


        By default, the reader:

        - Reads tags on all antenna ports. Use `antennas` to select specific ports.

        - Reports each unique tag once per reporting interval. Use `filter` to restrict which tags are reported.

        - Reports tags every second. Use `modeSpecificSettings.interval` to change the reporting interval.


        ### CUSTOM


        `CUSTOM` mode exposes the low-level radio configuration options and is intended for advanced users.


        ### PORTAL


        `PORTAL` mode reports every unique tag that passes each antenna after a GPI event starts the read period. The reader continues reading until no new unique tag is detected for the configured stop interval, and then waits for the next GPI event.


        By default, the reader:

        - Reads tags on all antenna ports. Use `antennas` to select specific ports.

        - Reports all unique tags once. Use `filter` to restrict which tags are reported.

        - Waits for a `LOW` signal on GPI port 1. Use `modeSpecificSettings.startTrigger` to change the trigger.

        - Stops after no new unique tag is detected for 3 seconds. Use `modeSpecificSettings.stopInterval` to change the stop interval.


        ### CONVEYOR


        `CONVEYOR` mode reads tags and reports every unique tag for each antenna.


        By default, the reader:

        - Reads tags on all antenna ports. Use `antennas` to select specific ports.

        - Reports all unique tags once. Use `filter` to restrict which tags are reported.


        ## 5. Mode and Field Rules


        | Rule | Detail |

        |---|---|

        | Wholesale replace | The new body replaces the previous mode. Omitted fields are not merged. |

        | `SIMPLE` | Do not send `tagMetaData`. Tag events include only `eventNum`, `format`, and `idHex`. |

        | `INVENTORY` | `accesses` is not allowed. Use `modeSpecificSettings.interval` to control how often each tag is reported. |

        | `PORTAL` | `radioStartConditions` and `radioStopConditions` are not allowed. GPI `port` is 1–4. |

        | Prefix `filter` | Cannot be set together with `query` or `selects`. |

        | `reportFilter` and `accesses` | Cannot both be set. |

        | Memory-bank metadata | `accesses` cannot be combined with `tagMetaData` values `RESERVED`, `EPC`, `TID`, or `USER`. |

        | Array lengths | When `transmitPower`, `antennaStopCondition`, or `query` is an array, its length must match `antennas`. |


        See the `custom_comprehensive` request example for a CUSTOM mode payload that combines query, selects, and tag metadata.

        '
      operationId: setMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModeRequest'
            examples:
              access_operations:
                summary: Run access operations
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  transmitPower:
                  - 30
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 50
                    target: A
                  accesses:
                  - type: READ
                    config:
                      membank: TID
                      wordPointer: 0
                      wordCount: 6
                  tagMetaData:
                  - ANTENNA
                  - RSSI
              conveyor_baseline:
                summary: CONVEYOR mode baseline
                value:
                  type: CONVEYOR
                  antennas:
                  - 1
                  - 2
                  - 3
                  - 4
                  transmitPower:
                  - 30
                  - 30
                  - 30
                  - 30
                  environment: HIGH_INTERFERENCE
                  antennaStopCondition:
                    type: DURATION
                    value: 100
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 200
                    target: A
                  inventoryProtocol:
                    mode: GEN2
                  tagMetaData:
                  - ANTENNA
                  - RSSI
                  - SEEN_COUNT
                  - CHANNEL
              custom_comprehensive:
                summary: CUSTOM mode with query, selects, and tag metadata
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  - 2
                  transmitPower:
                  - 27
                  - 27
                  query:
                    sel: NOT_SL
                    session: S1
                    tagPopulation: 10
                    target: A
                  selects:
                  - target: S1
                    action: INVB_NOTHING
                    membank: TID
                    pointer: 6
                    length: 24
                    mask: "800600"
                  tagMetaData:
                  - ANTENNA
                  - RSSI
                  - READERLOCATION
              filter_by_prefix:
                summary: Filter tags by prefix
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  - 2
                  transmitPower: 27
                  filter:
                    value: E280
                    match: prefix
                    operation: include
              inventory_report_interval:
                summary: INVENTORY mode with report interval
                value:
                  type: INVENTORY
                  environment: HIGH_INTERFERENCE
                  antennas:
                  - 1
                  - 2
                  transmitPower:
                  - 27
                  - 27
                  modeSpecificSettings:
                    interval:
                      unit: seconds
                      value: 60
                  antennaStopCondition:
                    type: DURATION
                    value: 100
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 256
                    target: A
                  inventoryProtocol:
                    mode: GEN2
                  delayBetweenAntennaCycles:
                    type: DISABLED
                    duration: 0
                  tagMetaData:
                  - ANTENNA
                  - RSSI
                  - SEEN_COUNT
                  - CHANNEL
              portal_gpi_trigger:
                summary: PORTAL mode with GPI start trigger
                value:
                  type: PORTAL
                  antennas:
                  - 1
                  - 2
                  transmitPower: 30
                  environment: HIGH_INTERFERENCE
                  modeSpecificSettings:
                    startTrigger:
                      port: 1
                      signal: HIGH
                    stopInterval: 5
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 100
                    target: A
                  inventoryProtocol:
                    mode: GEN2
                  tagMetaData:
                  - ANTENNA
                  - RSSI
                  - SEEN_COUNT
              radio_stop_duration:
                summary: Radio stop duration
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  - 2
                  transmitPower:
                  - 28
                  - 28
                  radioStopConditions:
                    duration: 60
              report_filter:
                summary: Report filter
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  - 2
                  transmitPower:
                  - 28
                  - 28
                  reportFilter:
                    duration: 5
                    type: PER_ANTENNA
              simple_baseline:
                summary: SIMPLE mode baseline
                value:
                  type: SIMPLE
                  antennas:
                  - 1
                  - 2
                  - 3
                  - 4
                  transmitPower: 30
                  antennaStopCondition:
                    type: DURATION
                    value: 400
                  query:
                    sel: ALL
                    session: S2
                    tagPopulation: 2000
                    target: AB
                  inventoryProtocol:
                    mode: GEN2
              write_access_password:
                summary: Assign an access password (WRITE to RESERVED bank)
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  transmitPower: 30
                  filter:
                    value: e28011b0a5050076c4d7530a
                    match: prefix
                    operation: include
                  accesses:
                  - type: WRITE
                    config:
                      membank: RESERVED
                      wordPointer: 2
                      data: A1B2C3D4
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetModeResponse'
      security:
      - bearerAuth: []
  /cloud/start:
    put:
      tags:
      - Control
      summary: Start RFID Inventory or BLE scan
      description: "## 1. Description\n\nThe `PUT /cloud/start` REST endpoint starts RFID inventory, BLE scanning, or both on the reader.\n\nBy default, an empty request body **starts RFID inventory only**. BLE does **not** autostart — you must include `scanType` with `\"ble\"` (and configure BLE first) to start BLE scanning.\n\n## 2. Endpoint Details\n\n| Property | Value |\n|---|---|\n| MQTT Command | `start` |\n| Pattern Name | Scan Control - Start |\n| REST Endpoint | `PUT /cloud/start` |\n| Communication Type | Client to Device (HTTP request/response) |\n| Applies To | FXR60 / FXR90 |\n| Authentication | Bearer token (`Authorization: Bearer <token>`) |\n| Content-Type | `application/json` |\n| Supported flags | `scanType`, `applyImpinjGen2X`, `doNotPersistState` |\n| Firmware Requirement | BLE requires reader build **4.0.11** or later. On earlier builds the `scanType` field is not available. |\n\n## 3. Supported flags (summary)\n\n| Flag | Type | Purpose |\n|---|---|---|\n| `scanType` | array **or** object | Choose which scan types to start — globally or per data endpoint |\n| `applyImpinjGen2X` | boolean | Apply the Gen2X configuration saved with `PUT /cloud/impinjGen2X` when RFID inventory starts |\n| `doNotPersistState` | boolean | Control RFID auto-resume after reboot (RFID only) |\n\n## 4. Before You Begin\n\n| What You Need | Details |\n|---|---|\n| Bearer token | Include a valid bearer token in the `Authorization` header (`Authorization: Bearer <token>`). |\n| RFID mode | Configure the operating mode with `PUT /cloud/mode` before starting RFID, or use the reader default. |\n| BLE (optional) | To start BLE, configure `PUT /cloud/bleConfig` first with `ble.enable: true`, then include `\"ble\"` in `scanType`. |\n| Gen2X (optional) | To apply Gen2X on start, save the configuration with `PUT /cloud/impinjGen2X` and send `applyImpinjGen2X: true`. Cannot combine with BLE-only start. |\n\n## 5. `scanType`\n\nControls which scan types start. Omit `scanType` for RFID-only (default).\n\n### Global start (REST and MQTT)\n\nA global start applies to every configured data endpoint: the reader starts the requested scan types and publishes the resulting data to **all** connections listed in `endpointConfig.data.event.connections`. To publish to only specific endpoints, use targeted start instead.\n\n`scanType` is an **array** of `\"ble\"` and/or `\"rfid\"`. The array must be non-empty and must not contain duplicates.\n\n```json\n{ \"scanType\": [\"ble\"] }\n```\n\n| Request body | Behavior |\n|---|---|\n| omitted / `{}` | Starts **RFID inventory only** (default). BLE is not started. |\n| `[\"rfid\"]` | Starts RFID inventory only. |\n| `[\"ble\"]` | Starts BLE scanning only. Requires BLE to be enabled in `PUT /cloud/bleConfig`. |\n| `[\"ble\", \"rfid\"]` | Starts both. |\n\n**Firmware requirement:** BLE scanning — and with it the `scanType` field — is available from reader build **4.0.11** onward. On builds older than 4.0.11, omit `scanType`; `PUT /cloud/start` starts RFID inventory only. Check the installed build with `GET /cloud/version` (`readerApplication`).\n\n### Targeted start (REST and MQTT)\n\nWhen multiple data endpoints are configured, REST and MQTT accept `scanType` as an **object** that maps each data-endpoint connection name to the scan types to start on that endpoint:\n\n```json\n{\n  \"scanType\": {\n    \"dataEndpoint1\": [\"ble\", \"rfid\"],\n    \"dataEndpoint2\": [\"rfid\"]\n  }\n}\n```\n\nEach key is a connection `name` from `endpointConfig.data.event.connections`. Each value is an array of `\"ble\"` and/or `\"rfid\"` for that endpoint only.\n\n## 6. `applyImpinjGen2X`\n\nSeparate from `scanType`. Send `applyImpinjGen2X: true` to apply the Gen2X features saved with `PUT /cloud/impinjGen2X` when RFID inventory starts.\n\n| Value | Behavior |\n|---|---|\n| omitted / `false` | Start without applying Gen2X. A saved Gen2X config is ignored until this flag is true. |\n| `true` | Apply the saved Gen2X config on **this** start only. After `PUT /cloud/stop`, send `true` again — activation does not persist across inventory sessions. Cannot be combined with `scanType: [\"ble\"]`. |\n\n```json\n{ \"applyImpinjGen2X\": true }\n```\n\n## 7. Persistence across reboots (`doNotPersistState`)\n\n`doNotPersistState` applies to **RFID only**. BLE never auto-resumes after reboot.\n\n| `doNotPersistState`\
        \ | Behavior on reboot or reconnect |\n|---|---|\n| `false` (default) | The reader remembers the running RFID inventory state and automatically resumes it. |\n| `true` | The running state is not saved. The reader stays idle until `PUT /cloud/start` is called again. |\n\nUse `doNotPersistState: true` for one-time or debugging sessions where automatic resume after reboot is not desired.\n"
      operationId: startInventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartInventoryRequest'
            examples:
              start_BLE_and_RFID:
                summary: Start BLE and RFID
                value:
                  scanType:
                  - ble
                  - rfid
              start_BLE_only:
                summary: Start BLE only
                value:
                  scanType:
                  - ble
              start_Inventory:
                summary: Start RFID inventory (default)
                value: {}
              start_Inventory with AutoStart:
                summary: Start inventory with AutoStart
                value:
                  doNotPersistState: false
              start_Inventory with ImpinjGen2X:
                summary: Start inventory with Impinj Gen2X
                value:
                  applyImpinjGen2X: true
              start_RFID_only:
                summary: Start RFID inventory (explicit)
                value:
                  scanType:
                  - rfid
              start_Targeted:
                summary: Targeted start per data endpoint
                value:
                  scanType:
                    dataEndpoint1:
                    - ble
                    - rfid
                    dataEndpoint2:
                    - rfid
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /cloud/stop:
    put:
      tags:
      - Control
      summary: Stop RFID Inventory or BLE scan
      description: "## 1. Description\n\nThe `PUT /cloud/stop` REST endpoint stops RFID inventory, BLE scanning, or both.\n\nBy default, if the request body is empty or `scanType` is not provided, the reader stops **RFID inventory only**.\n\n## 2. Endpoint Details\n\n| Property | Value |\n|---|---|\n| MQTT Command | `stop` |\n| Pattern Name | Scan Control - Stop |\n| REST Endpoint | `PUT /cloud/stop` |\n| Communication Type | Client to Device (HTTP request/response) |\n| Applies To | FXR60 / FXR90 |\n| Authentication | Bearer token (`Authorization: Bearer <token>`) |\n| Content-Type | `application/json` |\n| Request fields | `scanType` (array or object) |\n| Firmware Requirement | BLE requires reader build **4.0.11** or later. On earlier builds the `scanType` field is not available. |\n\n## 3. Supported flags (summary)\n\n| Flag | Type | Purpose |\n|---|---|---|\n| `scanType` | array **or** object | Choose which scan types to stop — globally or per data endpoint |\n\n## 4. Global stop (REST and MQTT)\n\nOmit `scanType` to stop RFID only (default).\n\n`scanType` as an **array** selects which scan types to stop globally. The array must be non-empty and must not contain duplicates.\n\n```json\n{ \"scanType\": [\"ble\"] }\n```\n\n| Request body | Result |\n|---|---|\n| `{}` | Stops RFID inventory only. This is the default behavior. |\n| `{ \"scanType\": [\"rfid\"] }` | Stops RFID inventory. BLE scanning continues if active. |\n| `{ \"scanType\": [\"ble\"] }` | Stops BLE scanning. RFID inventory continues if active. |\n| `{ \"scanType\": [\"ble\", \"rfid\"] }` | Stops both. |\n\nStop is **not** a no-op. Stopping a scan type that is not running returns **422** (`No scan is currently active`). Check `GET /cloud/status` first if you are not sure what is running.\n\n**Firmware requirement:** BLE scanning — and with it the `scanType` field — is available from reader build **4.0.11** onward. On builds older than 4.0.11, send an empty body `{}`, which stops RFID inventory. Check the installed build with `GET /cloud/version` (`readerApplication`).\n\n## 5. Targeted stop (REST and MQTT)\n\nWhen multiple data endpoints are configured, REST and MQTT accept `scanType` as an **object** that maps each data-endpoint connection name to the scan types to stop on that endpoint:\n\n```json\n{\n  \"scanType\": {\n    \"dataEndpoint1\": [\"ble\", \"rfid\"],\n    \"dataEndpoint2\": [\"rfid\"]\n  }\n}\n```\n\nEach key is a connection `name` from `endpointConfig.data.event.connections`. Each value is an array of `\"ble\"` and/or `\"rfid\"` to stop for that endpoint only. Endpoints omitted from the object are not affected.\n\n## 6. Before You Begin\n\n| What You Need | Details |\n|---|---|\n| Current activity | Check `GET /cloud/status` if you need to confirm RFID or BLE activity before stopping. |\n| Stop scope | Choose global array form, or targeted object form when stopping per data endpoint. |\n"
      operationId: stopInventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopInventoryRequest'
            examples:
              stop_BLE_and_RFID:
                summary: Stop BLE and RFID
                value:
                  scanType:
                  - ble
                  - rfid
              stop_BLE_only:
                summary: Stop BLE only
                value:
                  scanType:
                  - ble
              stop_RFID:
                summary: Stop RFID
                value: {}
              stop_RFID_explicit:
                summary: Stop RFID (explicit)
                value:
                  scanType:
                  - rfid
              stop_Targeted:
                summary: Targeted stop per data endpoint
                value:
                  scanType:
                    dataEndpoint1:
                    - ble
                    - rfid
                    dataEndpoint2:
                    - rfid
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /cloud/version:
    get:
      tags:
      - System
      summary: Retrieves reader component version information
      description: '## 1. Description


        The `GET /cloud/version` REST endpoint retrieves detailed hardware and software component version information from the reader''s software stack.


        This endpoint returns:


        - Reader application, radio firmware, and cloud agent versions

        - Radio control application version

        - Reader model and serial number

        - Available OS upgrade paths (`availableOsUpgrades`; empty when none)

        - Firmware revert information (`revertBackFirmware`)


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_version` |

        | Pattern Name | Version Query |

        | REST Endpoint | `GET /cloud/version` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve firmware, model, serial number, and upgrade details |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/version` to:


        - Confirm the installed firmware versions before or after a system update

        - Verify the exact reader model when applying model-specific configuration

        - Capture the serial number for asset tracking, remote fleet management, or support cases

        - Audit whether a downloaded OS upgrade is waiting (`availableOsUpgrades`)


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `readerApplication` | Current reader software version | Determines which features and API operations are available. |

        | `radioFirmware` | Firmware running on the radio module | Affects RF behavior, read performance, and hardware compatibility. |

        | `cloudAgentApplication` | Cloud agent version | Governs device-to-cloud messaging behavior and cloud connectivity. |

        | `model` | `FXR90`, `FX7500`, `FX9600`, `ATR7000`, or `FXR60` | Drives physical capabilities and model-specific settings. |

        | `serialNumber` | Unique reader serial number | Identifies the device for support cases and asset records. |

        | `availableOsUpgrades` | Is the object empty or populated? | A populated object means a downloaded OS upgrade is ready to install. An empty object `{}` means none is waiting. |

        | `revertBackFirmware` | Object | Versions available for reverting the reader firmware. |

        '
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVersionResponse'
              example:
                availableOsUpgrades: {}
                cloudAgentApplication: 0.6.2.64
                model: FXR60
                radioControlApplication: 0.2.58.7
                radioFirmware: 2.1.70.0
                readerApplication: 5.0.7
                revertBackFirmware: {}
                serialNumber: "260975251E0049"
      security:
      - bearerAuth: []
  /cloud/status:
    get:
      tags:
      - System
      summary: Retrieves reader operational statistics
      description: "## 1. Description\n\nThe `GET /cloud/status` REST endpoint retrieves operational statistics and health information from the reader at the moment of the request.\n\nThis endpoint returns:\n\n- Uptime and current system time\n- Radio connection and activity state\n- Reader temperature\n- CPU and RAM usage\n- Flash storage usage by partition\n- Antenna port connection states\n- NTP synchronization status\n- Cloud interface connection status\n- Power source and power-negotiation state\n- Active Impinj Gen2X feature status (when a Gen2X feature is running)\n- BLE scanner runtime status (scan state, scan start time, and beacon counts by protocol)\n\nThe `ble` section is present only when BLE is supported and its status is available. No request body is required.\n\n## 2. Endpoint Details\n\n| Property | Value |\n|---|---|\n| MQTT Command | `get_status` |\n| Pattern Name | Reader Status Query |\n| REST Endpoint | `GET /cloud/status` |\n| Communication Type | Client to Device (HTTP request/response) |\n| Applies To | FXR60 / FXR90 |\n| Authentication | Bearer token (`Authorization: Bearer <token>`) |\n| Supported Operations | Retrieve live operational statistics and health |\n\n## 3. When to Use This Endpoint\n\nUse `GET /cloud/status` to:\n\n- Confirm the reader is powered, healthy, and reachable\n- Verify the radio is connected before starting inventory\n- Monitor reader temperature for thermal issues\n- Synchronize against the reader's current system time\n- Check CPU, RAM, and flash usage during high-load scenarios\n- Confirm BLE scanning is active and review beacon counts by protocol\n\nKey fields to check in the response:\n\n| Field | What to Check | Why It Matters |\n|---|---|---|\n| `uptime` | How long has the reader been running? | Long uptimes confirm stability; short uptimes indicate an unexpected restart. |\n| `radioConnection` | Is the value `connected`? | Inventory cannot run if the radio is disconnected. |\n| `radioActivity` | Is it `active` or `inactive`? | Confirms whether an inventory session is currently in progress. |\n| `temperature` | Is the value within safe operating range? | Excessive temperature can cause throttling or hardware faults. |\n| `antennas` | Are expected ports `connected`? | A `disconnected` antenna port means tags on that port will not be read. |\n| `ntp.offset` | Is the offset near zero? | A large NTP offset means event timestamps may be inaccurate. |\n| `ble.scanState` | Is the scan running? | Confirms whether the BLE scanner is currently active (`running`) or `stopped`. |\n| `ble.scanStartTime` | When did the current scan start? | ISO 8601 timestamp marking when BLE scanning last started. |\n| `ble.beaconCounts` | Are advertisements being seen? | Per-protocol counts (`iBeacon`, `altBeacon`, `eddystone`, `generic`, `total`) confirm beacons are being detected in the current scan window. |\n| `impinjGen2X.feature` | Which Gen2X feature is active (`fastID`, `tagProtect`, `tagFocus`, `tagQuieting`, or `none`)? | Names the currently running feature. `none` when Gen2X is not running. |\n| `impinjGen2X.isActive` | Is a Gen2X feature running in this inventory session? | These two fields show the runtime state of Gen2X. When Gen2X is running, `feature` names the running feature and `isActive` is `true`. When it is not running, `feature` is `none` and `isActive` is `false`. Use `GET /cloud/impinjGen2X` to read the saved configuration. |\n\n## 4. BLE Status Fields\n\nWhen BLE is supported and active, the response includes a `ble` object:\n\n| Field | Type | Description |\n|---|---|---|\n| `ble.scanState` | string | Current BLE scanner state — `running` or `stopped`. |\n| `ble.scanStartTime` | string (date-time) | ISO 8601 timestamp of when the BLE scan was last started. |\n| `ble.beaconCounts.total` | integer | Total BLE advertisements observed in the current scan window. |\n| `ble.beaconCounts.iBeacon` | integer | Number of iBeacon advertisements observed. |\n| `ble.beaconCounts.altBeacon` | integer | Number of AltBeacon advertisements observed. |\n| `ble.beaconCounts.eddystone` |\
        \ integer | Number of Eddystone advertisements observed. |\n| `ble.beaconCounts.generic` | integer | Number of generic BLE advertisements observed. |\n\nExample `ble` section:\n\n```json\n\"ble\": {\n  \"scanState\": \"running\",\n  \"scanStartTime\": \"2026-05-21T13:46:16.955Z\",\n  \"beaconCounts\": {\n    \"total\": 108,\n    \"iBeacon\": 75,\n    \"altBeacon\": 33,\n    \"eddystone\": 0,\n    \"generic\": 0\n  }\n}\n```\n"
      operationId: getStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStatusResponse'
              example:
                antennas:
                  "1": connected
                  "2": disconnected
                  "3": disconnected
                  "4": disconnected
                  "5": connected
                  "6": connected
                ble:
                  beaconCounts:
                    altBeacon: 0
                    eddystone: 0
                    generic: 0
                    iBeacon: 0
                    total: 0
                  scanStartTime: ''
                  scanState: stopped
                cpu:
                  system: 0
                  user: 19
                flash:
                  platform:
                    free: 0
                    total: 0
                    used: 0
                  readerConfig:
                    free: 0
                    total: 0
                    used: 0
                  readerData:
                    free: 0
                    total: 0
                    used: 0
                  rootFileSystem:
                    free: 0
                    total: 0
                    used: 0
                impinjGen2X:
                  feature: none
                  isActive: false
                interfaceConnectionStatus:
                  data:
                  - connectionError: ''
                    connectionStatus: connected
                    description: Tag events (MQTT_MTLS)
                    interface: DATA_MQTT_MTLS
                ntp:
                  offset: 0.035904
                  reach: 213
                powerNegotiation: POE+
                powerSource: PWR_BRICK
                radioActivity: inactive
                radioConnection: connected
                ram:
                  free: 72
                  total: 100
                  used: 28
                systemTime: 05/09/2026 13:20
                temperature: 31
                uptime: 1D23H28M41S
      security:
      - bearerAuth: []
  /cloud/config:
    get:
      tags:
      - System
      summary: Retrieves reader configuration
      description: '## 1. Description


        The `GET /cloud/config` REST endpoint retrieves the reader''s full configuration, including RF settings, GPIO and LED defaults, and reader-gateway endpoint settings.


        This endpoint returns:


        - GPIO and LED trigger configuration (`GPIO-LED`), including GPO and LED defaults; returned as an empty object `{}` when unset (not the string `"NOT_CONFIGURED"`)

        - Reader-gateway settings including tag data retention, batching, and endpoint configuration


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_config` |

        | Pattern Name | Reader Configuration Query |

        | REST Endpoint | `GET /cloud/config` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve active reader configuration |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/config` to:


        - Review the active configuration before calling `PUT /cloud/config`

        - Audit GPIO and LED default states across a fleet of readers

        - Inspect tag-data retention and batching settings

        - Confirm which data and management endpoints are configured


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `READER-GATEWAY` | Are endpoint URLs and credentials correct? | Determines where tag data is delivered and how the reader authenticates. |

        | `GPIO-LED.GPODefaults` | What are the default GPO states? | Ensures GPO-triggered logic starts from the expected initial state. |

        | `GPIO-LED.LEDDefaults` | What are the LED default states? | Confirms expected LED behavior on startup and after a reboot. |

        | `GPIO-LED` unset | Is the value `{}`? | Empty object means GPIO-LED is not configured. |

        '
