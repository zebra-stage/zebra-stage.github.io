      summary: Retrieves network interfaces
      description: '## 1. Description


        The `GET /cloud/networkInterfaces` REST endpoint retrieves the network interface names on the reader.


        This endpoint returns:


        - `availableNetworkInterfaces` — names such as `eth0`, `mlan0`, `bnep0`, `uap0`


        Cellular interface `wan0` appears in this list on FXR90 only. It is not present on FXR60.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_networkInterfaces` |

        | Pattern Name | Network Interface Query |

        | REST Endpoint | `GET /cloud/networkInterfaces` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve network interface names |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/networkInterfaces` to:


        - Read `availableNetworkInterfaces`

        '
      operationId: getNetworkinterfaces
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNetworkinterfacesResponse'
              examples:
                fxr60:
                  summary: fxr60
                  value:
                    availableNetworkInterfaces:
                    - eth0
                    - mlan0
                    - bnep0
                    - uap0
                fxr90:
                  summary: fxr90
                  value:
                    availableNetworkInterfaces:
                    - eth0
                    - mlan0
                    - bnep0
                    - wan0
                with_uap0:
                  summary: eth0 mlan0 bnep0 uap0
                  value:
                    availableNetworkInterfaces:
                    - eth0
                    - mlan0
                    - bnep0
                    - uap0
