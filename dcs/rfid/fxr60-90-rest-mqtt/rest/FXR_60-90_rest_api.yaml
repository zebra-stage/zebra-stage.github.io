                    type: array
                    description: List of resolutions supported by the monitor hardware.
                    items:
                      type: string
    GetAppledResponse:
      type: object
      properties:
        status:
          type: string
          description: Current state of the application LED.
          enum:
          - DEFAULT
          - NON_DEFAULT
    SetAppledRequest:
      type: object
      required:
      - color
      - flash
      - seconds
      properties:
        color:
          type: string
          description: The color of the LED (red, amber, green, off).
          enum:
          - red
          - amber
          - green
          - "off"
        flash:
          type: boolean
          description: Whether the LED should blink.
        seconds:
          type: number
          description: Duration in seconds. Use 0 for indefinite.
    SetAppledResponse:
      type: string
      description: Returns an empty string on success.
    GetStackledResponse:
      oneOf:
      - type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - DEFAULT
        additionalProperties: false
      - type: object
        required:
        - status
        - color
        - flash
        - seconds
        properties:
          status:
            type: string
            enum:
            - NON_DEFAULT
          color:
            type: string
            enum:
            - red
            - amber
            - green
            - blue
            - "off"
          brightness:
            type: string
            enum:
            - low
            - med
            - high
          flash:
            type: boolean
          seconds:
            type: integer
          seconds_remaining:
            type: integer
    SetStackledRequest:
      type: object
      required:
      - color
      - flash
      - seconds
      properties:
        color:
          type: string
          description: The color of the LED (red, amber, green, blue, off)
          enum:
          - red
          - amber
          - green
          - blue
          - "off"
        brightness:
          type: string
          description: The brightness of the LED (low, med, high). Defaults to low.
          enum:
          - low
          - med
          - high
        flash:
          type: boolean
        seconds:
          type: integer
    SetStackledResponse:
      type: string
      description: Returns an empty string on success.
    GetGpoStatusResponse:
      type: object
      properties:
        "1":
          type: string
          enum:
          - HIGH
          - LOW
        "2":
          type: string
          enum:
          - HIGH
          - LOW
        "3":
          type: string
          enum:
          - HIGH
          - LOW
        "4":
          type: string
          enum:
          - HIGH
          - LOW
    SetGpoRequest:
      type: object
      required:
      - port
      - state
      properties:
        port:
          type: number
          description: GPO port number (1–4 for FXR90; device-specific maximum applies).
          minimum: 1
          maximum: 4
        state:
          type: boolean
          description: Desired GPO state — true for HIGH, false for LOW.
    SetGpoResponse:
      type: string
      description: Returns an empty string on success.
    GetGPIStatusResponse:
      type: object
      required:
      - "1"
      - "2"
      - "3"
      - "4"
      properties:
        "1":
          type: string
          description: GPI port 1 state reported by the reader.
          enum:
          - HIGH
          - LOW
        "2":
          type: string
          description: GPI port 2 state reported by the reader.
          enum:
          - HIGH
          - LOW
        "3":
          type: string
          description: GPI port 3 state reported by the reader.
          enum:
          - HIGH
          - LOW
        "4":
          type: string
          description: GPI port 4 state reported by the reader.
          enum:
          - HIGH
          - LOW
    GetRegionResponse:
      type: object
      properties:
        FrequencyHopping:
          type: boolean
          description: True when frequency hopping is enabled in the active region configuration.
        region:
          type: string
          description: Active region name configured on the reader (for example, US).
        regulatoryStandard:
          type: string
          description: Active regulatory standard for the region (for example, FCC, ETSI, CANADA_FCC_15).
        lbtEnabled:
          type: boolean
          description: True when Listen-Before-Talk is enabled for the selected regulatory configuration.
        channelData:
          type: array
          description: Active channel list used by the region/standard configuration, represented as frequencies (kHz).
          items:
            type: string
        country:
          type: string
          description: Country name associated with the active region configuration.
        minTxPowerSupported:
          type: number
          description: Minimum transmit power supported for the active regulatory standard.
        maxTxPowerSupported:
          type: number
          description: Maximum transmit power supported for the active regulatory standard.
    SetRegionRequest:
      type: object
      required:
      - country
      - standardname
      properties:
        country:
          type: string
          description: Country name. Valid values can be retrieved from GET /cloud/supportedRegionList.
        standardname:
          type: string
          description: Regulatory standard name for the chosen country. Valid values can be retrieved from GET /cloud/supportedStandardList?region=<country>.
        isLBT:
          type: boolean
          description: Optional. Enables Listen-Before-Talk when supported by the selected standard.
        channeldata:
          type: array
          description: Optional channel frequency list (kHz) to apply when channel selection is supported by the selected standard.
          items:
            type: integer
    SetRegionResponse:
      type: string
      description: Returns an empty string on success.
    GetSupportedregionlistResponse:
      type: object
      required:
      - SupportedRegions
      properties:
        SupportedRegions:
          type: array
          description: List of country/region names supported by the reader.
          items:
            type: string
            description: Supported country/region name.
    GetSupportedstandardlistResponse:
      type: object
      properties:
        SupportedStandards:
          type: array
          items:
            type: object
            properties:
              StandardName:
                type: string
                description: Regulatory standard identifier for the region.
              channeldata:
                type: array
                description: List of center frequencies (in kHz) for the standard's channels.
                items:
                  type: string
              isChannelSelectable:
                type: string
                description: Whether individual channels can be selected. String-encoded boolean.
                enum:
                - "true"
                - "false"
              isHoppingConfigurable:
                type: string
                description: Whether frequency hopping is configurable. String-encoded boolean.
                enum:
                - "true"
                - "false"
              isLBTConfigurable:
                type: string
                description: Whether Listen-Before-Talk (LBT) is configurable. String-encoded boolean.
                enum:
                - "true"
                - "false"
    GetModeRequest:
      type: object
      properties:
        verbose:
          type: boolean
          description: Includes verbose operating mode details when true.
    SetModeRequest:
      allOf:
      - $ref: '#/components/schemas/operatingMode.v1'
      - type: object
        description: Additional legacy fields accepted by set_mode.
        properties:
          component:
            type: string
            description: Legacy wrapper field retained for backward compatibility.
          linkProfile:
            type: number
            description: Link profile identifier.
          payload:
            type: string
            description: Legacy wrapper field retained for backward compatibility.
    SetModeResponse:
      type: string
      description: Returns an empty string on success.
    StartInventoryRequest:
      type: object
      properties:
        scanType:
          oneOf:
          - type: array
            description: Scan types to start across all configured data endpoints. Omit for RFID-only (default).
            items:
              type: string
              enum:
              - ble
              - rfid
            minItems: 1
            uniqueItems: true
          - type: object
            description: Scan types to start for each configured data endpoint. Keys are data-endpoint connection names.
            additionalProperties:
              type: array
              items:
                type: string
                enum:
                - ble
                - rfid
              minItems: 1
              uniqueItems: true
        doNotPersistState:
          type: boolean
          description: Controls whether the started inventory state is persisted across reboot. If `true`, the state is not persisted and auto-start is not enabled after reboot. If `false`, the state is persisted across reboot, enabling auto-start.
        applyImpinjGen2X:
          type: boolean
          description: 'When true, applies the previously configured Impinj Gen2X features (FastID, TagProtect, TagFocus, TagQuieting) on this start only. After stop, send true again. Cannot be used with `scanType: ["ble"]`.'
    StopInventoryRequest:
      type: object
      properties:
        scanType:
          oneOf:
          - type: array
            description: Scan types to stop across all configured data endpoints. Omit for RFID-only (default).
            items:
              type: string
              enum:
              - ble
              - rfid
            minItems: 1
            uniqueItems: true
          - type: object
            description: Scan types to stop for each configured data endpoint. Keys are data-endpoint connection names.
            additionalProperties:
              type: array
              items:
                type: string
                enum:
                - ble
                - rfid
              minItems: 1
              uniqueItems: true
    GetVersionResponse:
