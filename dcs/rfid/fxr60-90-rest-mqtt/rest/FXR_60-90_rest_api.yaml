                    modeSpecificSettings:
                      interval:
                        unit: seconds
                        value: 60
                    query:
                      sel: ALL
                      session: S1
                      tagPopulation: 256
                      target: A
                    radioStartConditions: {}
                    radioStopConditions: {}
                    rssiFilter:
