          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEsimConfigResponse'
              examples:
                gnd1_gnd2:
                  summary: Profiles gnd1 and gnd2
                  value:
                    eid: "89049032005008882600033489161010"
                    imei: "350000000000006"
                    profiles:
                    - enabled: true
                      iccid: "8900000000000000002"
                      profileNickName: gnd1
                      provider: Airtel
                    - enabled: false
                      iccid: "8900000000000000001"
                      profileNickName: gnd2
                      provider: Vodafone
                profiles_present:
                  summary: profiles present
                  value:
                    eid: "89049032005008882600033489161010"
                    imei: "350000000000006"
                    profiles:
                    - enabled: true
                      iccid: "8900000000000000002"
                      profileNickName: gnd1
                      provider: Airtel
                    - enabled: false
                      iccid: "8900000000000000001"
