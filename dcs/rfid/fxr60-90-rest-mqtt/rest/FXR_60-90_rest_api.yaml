    SetBleConfigRequest:
      type: object
      required:
      - ble
      properties:
        ble:
          type: object
          required:
          - enable
          - scanIntervalSec
          - additionalFilters
          - protocols
          properties:
            enable:
              type: boolean
            scanIntervalSec:
              type: integer
              minimum: 0
              maximum: 300
            additionalFilters:
              type: object
              additionalProperties: false
              properties:
                rssi:
                  type: integer
                  minimum: -127
                  maximum: 0
                serviceUuids16:
                  type: array
                  items:
                    type: string
                    oneOf:
                    - pattern: ^(0[xX])?[0-9A-Fa-f]{4}$
                    - pattern: ^0000[0-9A-Fa-f]{4}-0000-1000-8000-00805[Ff]9[Bb]34[Ff][Bb]$
                serviceUuids128:
                  type: array
                  items:
                    type: string
                    pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
            protocols:
              type: object
              description: Protocol-specific BLE scanner configurations.
              properties:
                iBeacon:
                  type: object
                  additionalProperties: false
                  required:
                  - enabled
                  properties:
                    enabled:
                      type: boolean
                    filters:
                      type: array
                      items:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          uuid:
                            type: string
                            description: Proximity UUID
                            pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
                          major:
                            type: integer
                            minimum: 0
                            maximum: 65535
                            description: Major value
                          minor:
                            type: integer
                            minimum: 0
                            maximum: 65535
                            description: Minor value
                          txPower:
                            type: integer
                            minimum: -128
                            maximum: 127
                            description: TX power / calibrated RSSI at 1m
                altBeacon:
                  type: object
                  additionalProperties: false
                  required:
                  - enabled
                  properties:
                    enabled:
                      type: boolean
                    filters:
                      type: array
                      items:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          mfgId:
                            type: string
                            description: Manufacturer ID (hex string)
                            pattern: ^[0-9A-Fa-f]{4}$
                          beaconId:
                            type: string
                            description: Beacon ID (UUID string)
                            pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
                          major:
                            type: integer
                            description: Major value
                            minimum: 0
                            maximum: 65535
                          minor:
                            type: integer
                            description: Minor value
                            minimum: 0
                            maximum: 65535
                          refRssi:
                            type: integer
                            description: Reference RSSI (TX power at 1m)
                            minimum: -128
                            maximum: 127
                eddystone:
                  type: object
                  additionalProperties: false
                  required:
                  - enabled
                  properties:
                    enabled:
                      type: boolean
                    filters:
                      type: array
                      description: Filter by Eddystone frame fields. Use `frameType` to target a specific frame type (URL, UID, EID). All other fields are optional and frame-type-specific.
                      items:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          frameType:
                            type: string
                            description: Eddystone frame type
                            enum:
                            - URL
                            - UID
                            - EID
                            - TLM
                          txPower:
                            type: integer
                            description: TX power at 0m (calibrated RSSI)
                            minimum: -128
                            maximum: 127
                          url:
                            type: string
                            description: Advertised URL (Eddystone-URL only)
                            pattern: ^https?://
                          namespace:
                            type: string
                            description: 10-byte namespace (Eddystone-UID only, hex string)
                            pattern: ^[0-9A-Fa-f]{20}$
                          instance:
                            type: string
                            description: 6-byte instance ID (Eddystone-UID only, hex string)
                            pattern: ^[0-9A-Fa-f]{12}$
                          ephemeralId:
                            type: string
                            description: 8-byte ephemeral ID (Eddystone-EID only, hex string)
                            pattern: ^[0-9A-Fa-f]{16}$
                generic:
                  type: object
                  additionalProperties: false
                  description: Configuration for GENERIC_BLE beacons. Filters match on device-level advertisement fields like address, addressType, name and alias.
                  required:
                  - enabled
                  properties:
                    enabled:
                      type: boolean
                    filters:
                      type: array
                      description: List of filter objects for GENERIC_BLE beacons. A beacon is forwarded if it matches any one filter entry.
                      items:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          address:
                            type: string
                            description: Bluetooth device address to match (e.g. "7E:41:25:1E:D5:16").
                            pattern: ^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$
                          addressType:
                            type: string
                            description: Bluetooth address type to match.
                            enum:
                            - public
                            - random
                          name:
                            type: string
                            minLength: 1
                            description: Device name to match against the advertisement name field.
                          alias:
                            type: string
                            minLength: 1
                            description: Device alias to match against the advertisement alias field.
