      properties:
        authenticationType:
          type: string
          enum:
          - BASIC
          description: Authentication method for fetching the certificate file. Authentication type NONE and certificate-based download authentication are not supported on FXR60/FXR90.
        authenticationOptions:
          type: object
          description: Credentials object used when `authenticationType` is `BASIC`. The reader accepts this key. Spec 11 still names it `options`.
          required:
          - username
          - password
          properties:
            username:
              type: string
            password:
              type: string
        name:
          type: string
          description: Logical name for the certificate to be installed on the device.
        pfxPassword:
          type: string
          description: Password for the PFX file, if applicable.
        type:
          type: string
          description: 'Certificate type. Valid values: server, client, app.'
          enum:
          - server
          - client
          - app
        url:
          type: string
          format: uri
          description: URL to download the certificate file from. Supported URL schemes are https://, ftps://, and sftp://.
          oneOf:
          - pattern: ^https://.+
          - pattern: ^ftps://.+
          - pattern: ^sftp://.+
        verifyPeer:
          type: boolean
          description: Verify the server TLS peer certificate.
        verifyHost:
          type: boolean
          description: Verify the server hostname in the TLS certificate.
        CACertificateFileLocation:
          type: string
          description: Path to a CA certificate file on the device.
        CACertificateFileContent:
          type: string
          description: PEM-encoded CA certificate content.
        publicKeyFileLocation:
          type: string
        publicKeyFileContent:
          type: string
        privateKeyFileLocation:
          type: string
        privateKeyFileContent:
          type: string
        installedCertificateType:
          type: string
        installedCertificateName:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
