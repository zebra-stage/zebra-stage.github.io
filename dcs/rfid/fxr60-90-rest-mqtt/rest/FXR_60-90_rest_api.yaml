  /cloud/certificates/{certname}:
    parameters:
    - name: certname
      in: path
      required: true
      description: Certificate name. This path value is used as the certificate name for refresh and delete operations.
      schema:
        type: string
    put:
      tags:
      - Certificate
      summary: Refresh certificate
      description: '## 1. Description


        The `PUT /cloud/certificates/{certname}` REST endpoint refreshes an installed certificate.


        This endpoint requires:


        - `{certname}` — certificate `name` in the URL

        - `type` — `server`, `client`, or `app` in the JSON body


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_refreshCertificate` |

        | Pattern Name | Certificate Refresh |

        | REST Endpoint | `PUT /cloud/certificates/{certname}` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Path Parameter | `certname` |

        | Required Request Fields | `type` |


        ## 3. Before You Begin


        Confirm the certificate is already installed. Use the JSON field name below.


        | Field | What to set |

        |---|---|

        | `certname` | Certificate `name` in the URL path. |

        | `type` | `server`, `client`, or `app`. Send in the JSON body. |

        '
      operationId: setRefreshcertificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRefreshcertificateRequest'
            examples:
              refresh_client_by_type:
                summary: Refresh client certificate by type
                value:
                  type: client
              refresh_client_certificate:
                summary: Refresh named client certificate
                value:
                  type: client
              refresh_server_by_type:
                summary: Refresh server certificate by type
                value:
                  type: server
              refresh_server_certificate:
                summary: Refresh named server certificate
                value:
                  type: server
              success:
                summary: Empty string on success
                value: ''
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRefreshcertificateResponse'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Certificate
      summary: Delete certificate
      description: '## 1. Description


        The `DELETE /cloud/certificates/{certname}` REST endpoint removes an installed certificate.


        This endpoint requires:


        - `{certname}` — certificate `name` in the URL

        - `type` — `client` or `app` in the JSON body


        `server` cannot be deleted.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `del_certificate` |

        | Pattern Name | Certificate Deletion |

        | REST Endpoint | `DELETE /cloud/certificates/{certname}` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Path Parameter | `certname` |

        | Required Request Fields | `type` |


        ## 3. Before You Begin


        Confirm the certificate name and type. Use the JSON field name below.


        | Field | What to set |

        |---|---|

        | `certname` | Certificate `name` in the URL path. |

        | `type` | `client` or `app`. Send in the JSON body. |

        '
      operationId: delCertificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelCertificateRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelCertificateResponse'
              examples:
                delete_client_certificate:
                  summary: Delete client certificate
                  value:
                    type: client
                success:
                  summary: success
                  value: ''
      security:
      - bearerAuth: []
  /cloud/caCertificates:
    get:
      tags:
      - Certificate
      summary: List installed CA certificates
      description: '## 1. Description


        The `GET /cloud/caCertificates` REST endpoint retrieves the CA certificates installed on the reader.


        This endpoint returns an array of installed CA certificate names.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_CACertificates` |

        | Pattern Name | CA Certificate Inventory Query |

        | REST Endpoint | `GET /cloud/caCertificates` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve installed CA certificate names |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/caCertificates` to:


        - List CA names currently installed on the reader

        - Verify a `PUT /cloud/caCertificates` request succeeded

        '
