                          value: E280AABBCCDDEEFF11223344
                      tagQuietMasks:
                      - SL_DEASSERT
                      - S2A
                      target: SL
                      stateAwareAction: DEASSERTSL_ASSERTSL
              disable_fastID:
                summary: Disable FastID
                value:
                  fastID:
                    enabled: false
              disable_protect_read:
                summary: Disable protected-tag visibility
                value:
                  tagProtect:
