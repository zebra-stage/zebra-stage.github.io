      description: Response payload returned by the user application. Structure is application-defined and not fixed.
    SetUninstalluserappRequest:
      type: object
      properties:
        appname:
          type: string
          description: Required for MQTT API. Not needed for local REST (use path parameter instead).
    SetUninstalluserappResponse:
