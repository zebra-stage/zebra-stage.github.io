                    action: enableTagProtection
                    password: "77777777"
                    tagID: e2801191a5030069073b426d
                    enableShortRange: true
              quiet_tags:
                summary: Quiet tags by EPC list
                value:
                  tagQuieting:
                    basic:
                      action: quiet
                      tagIDs:
                      - e2801191a5030069073b426d
                      - e2801191a5030069073b426e
              unprotect_tag:
                summary: Unprotect tag
                value:
                  tagProtect:
                    action: disableTagProtection
                    password: "77777777"
                    tagID: e2801191a5030069073b426d
              unquiet_tags:
                summary: Unquiet tags by EPC list
                value:
                  tagQuieting:
                    basic:
                      action: unquiet
                      tagIDs:
                      - e2801191a5030069073b426d
      responses:
