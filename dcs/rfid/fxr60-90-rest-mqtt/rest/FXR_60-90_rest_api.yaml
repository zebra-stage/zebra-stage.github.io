              type: string
              description: Antenna 2 connection state.
              enum:
              - connected
              - disconnected
            3:
              type: string
              description: Antenna 3 connection state.
              enum:
              - connected
              - disconnected
            4:
              type: string
              description: Antenna 4 connection state.
              enum:
              - connected
              - disconnected
            5:
              type: string
              description: Antenna 5 connection state.
              enum:
              - connected
              - disconnected
            6:
              type: string
              description: Antenna 6 connection state.
              enum:
              - connected
              - disconnected
            7:
              type: string
              description: Antenna 7 connection state.
              enum:
              - connected
              - disconnected
            8:
              type: string
              description: Antenna 8 connection state.
              enum:
              - connected
              - disconnected
        cpu:
          type: object
          description: CPU utilization statistics reported by the reader.
          properties:
            system:
              type: number
              description: Percentage of CPU time spent in kernel/system mode.
            user:
              type: number
              description: Percentage of CPU time spent in user mode.
        flash:
          type: object
          description: Flash storage utilization by partition.
          properties:
            platform:
              type: object
              description: Usage metrics for the platform partition.
              properties:
                free:
                  type: number
                total:
                  type: number
                used:
                  type: number
            readerConfig:
              type: object
              description: Usage metrics for the reader configuration partition.
              properties:
                free:
                  type: number
                total:
                  type: number
                used:
                  type: number
            readerData:
              type: object
              description: Usage metrics for the reader data partition.
              properties:
                free:
                  type: number
                total:
                  type: number
                used:
                  type: number
            rootFileSystem:
              type: object
              description: Usage metrics for the root filesystem partition.
              properties:
                free:
                  type: number
                total:
                  type: number
                used:
                  type: number
        interfaceConnectionStatus:
          type: object
          description: Connectivity status for configured cloud/network interfaces.
          properties:
            data:
              type: array
              description: Per-interface connection status entries.
              items:
                type: object
                properties:
                  connectionError:
                    type: string
                    description: Last connection error message, if any.
                  connectionStatus:
                    type: string
                    description: Current connection state for the interface.
                  description:
                    type: string
                    description: Human-readable interface description.
                  interface:
                    type: string
                    description: Interface name.
        ntp:
          type: object
          description: NTP synchronization status information.
          properties:
            offset:
              type: number
              description: Current NTP clock offset.
            reach:
              type: number
              description: NTP reachability register value.
        powerNegotiation:
          type: string
          description: Power negotiation mode reported by the reader.
        powerSource:
          type: string
          description: Current power source for the reader.
          enum:
          - PWR_BRICK
          - POE
          - POE+
        radioActivity:
          type: string
          description: Current radio activity state.
          enum:
          - active
          - inactive
        radioConnection:
          type: string
          description: Current radio connection state.
          enum:
          - connected
          - disconnected
        ram:
          type: object
          description: RAM utilization statistics.
          properties:
            free:
              type: number
              description: Free RAM amount.
            total:
              type: number
              description: Total RAM amount.
            used:
              type: number
              description: Used RAM amount.
        systemTime:
          type: string
        temperature:
          type: number
        uptime:
          type: string
        impinjGen2X:
          type: object
          description: Impinj Gen2X runtime status for the current inventory session. isActive means a saved Gen2X config was applied on this start, not that FastID or TagFocus is switched on. Use GET /cloud/impinjGen2X to read enabled.
          properties:
            isActive:
              type: boolean
              description: True when a Gen2X config is running in this inventory session. Does not mean the feature's enabled flag is true.
            feature:
              type: string
              description: Last saved Gen2X feature object, or none when Gen2X is not running.
              enum:
              - none
              - fastId
              - tagFocus
              - tagProtect
