        This endpoint returns:


        - `status` — `DEFAULT` means the LED reflects the reader''s normal LED status (reader-controlled). `NON_DEFAULT` means a prior `PUT /cloud/app-led` set the LED to an explicit color, flash, and duration, overriding the normal status.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_appled` |

        | Pattern Name | Application LED Query |

        | REST Endpoint | `GET /cloud/app-led` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve application LED status |

        | Response field | `status`: `DEFAULT` \| `NON_DEFAULT` |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/app-led` to:


