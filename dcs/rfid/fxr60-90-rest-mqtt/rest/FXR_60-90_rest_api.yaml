  /cloud/stack-led:
    get:
      tags:
      - Stack-led
      summary: Retrieves stack LED state
      description: '## 1. Description


        > **FXR60 Premium only.** The stack LED is not on other FXR60 variants. The FXR90 has no stack light.


        The `GET /cloud/stack-led` REST endpoint retrieves the current stack LED state.


        ## 2. Status values


        The response always includes `status`. Additional fields appear only when the LED is under an active override.


        | `status` | Meaning | When returned | Response body |

        |---|---|---|---|

        | `DEFAULT` | The stack LED reflects the reader''s normal operating state (reader-controlled). No custom color, flash, or timer is active. | No prior `PUT /cloud/stack-led` override is in effect, or a timed override has expired and the LED returned to reader control. | `{ "status": "DEFAULT" }` only |

        | `NON_DEFAULT` | An active custom LED pattern is in effect from a prior `PUT /cloud/stack-led`. | A `PUT /cloud/stack-led` set an explicit color, flash, brightness, and/or duration that is still active. | `status`, `color`, `brightness`, `flash`, `seconds`, and `seconds_remaining` |


        When `status` is `NON_DEFAULT`:


        - `color`, `brightness`, and `flash` describe the active override

        - `seconds` is the configured duration (`0` means until the next `PUT /cloud/stack-led`)

        - `seconds_remaining` counts down on timed overrides


        ## 3. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_stackled` |

        | Pattern Name | Stack LED Query |

        | REST Endpoint | `GET /cloud/stack-led` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 Premium |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve stack LED state |


        ## 4. When to Use This Endpoint


        Use `GET /cloud/stack-led` to:


        - Check whether the LED is `DEFAULT` or `NON_DEFAULT`

        - Read color, brightness, and flash on an active override

        - Check `seconds_remaining` on a timed override

        - Confirm a prior `PUT /cloud/stack-led` call

        '
      operationId: getStackled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStackledResponse'
              examples:
                green_med_solid:
                  summary: Green medium solid override
                  value:
                    status: NON_DEFAULT
                    color: green
                    brightness: med
                    flash: false
                    seconds: 0
                    seconds_remaining: 0
                reader_controls_led:
                  summary: Reader controls LED
                  value:
                    status: DEFAULT
                red_flash_countdown:
                  summary: Red flash with countdown
                  value:
                    status: NON_DEFAULT
                    color: red
                    brightness: high
                    flash: true
                    seconds: 30
                    seconds_remaining: 18
      security:
      - bearerAuth: []
    put:
      tags:
      - Stack-led
      summary: Updates stack LED state
      description: '## 1. Description


        > **FXR60 Premium only.** The stack LED is not on other FXR60 variants. The FXR90 has no stack light.


        The `PUT /cloud/stack-led` REST endpoint sets the stack LED to the specified color, flash pattern, brightness, and duration.


        Send a JSON object with the fields below. The reader applies the requested LED state immediately.


        This endpoint requires:


        - `color` — `red`, `amber`, `green`, `blue`, or `off`

        - `flash` — `true` to blink, `false` for solid

        - `seconds` — how long to keep this state. `0` means until the next `PUT /cloud/stack-led`


        `brightness` is optional: `low`, `med`, or `high`. If omitted, the reader uses `low`.


        `blue` is valid on the stack LED. It is not valid on `PUT /cloud/app-led`.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_stackled` |

        | Pattern Name | Stack LED Control |

        | REST Endpoint | `PUT /cloud/stack-led` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 Premium |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Supported Colors | `red`, `amber`, `green`, `blue`, `off` |

        | Supported Brightness | `low`, `med`, `high` (default `low`) |

        | Required Request Fields | `color`, `flash`, `seconds` |


        ## 3. Before You Begin


        | What You Need | Details |

        |---|---|

        | Color | `red`, `amber`, `green`, `blue`, or `off`. |

        | Flash | `true` blinks. `false` is solid. |

        | Duration | Seconds to keep this state. Use `0` until the next `PUT /cloud/stack-led`. |

        | Brightness | Optional. `low`, `med`, or `high`. |


        ## 4. Response


        On success:


        - **REST** — HTTP `200 OK` with an empty string body (`""`). There is no JSON response payload.

        - **MQTT** — `response: "success"` with an empty `payload` object. The command envelope is returned; the LED settings are not echoed back.


        After a successful call, `GET /cloud/stack-led` returns `status: "NON_DEFAULT"` with the active color, flash, brightness, and timer fields until the override ends.

        '
      operationId: setStackled
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStackledRequest'
            examples:
              amber_med_flash:
                summary: amber med flash
                value:
                  color: amber
                  brightness: med
                  flash: true
                  seconds: 15
              green_solid:
                summary: green solid
                value:
                  color: green
                  flash: false
                  seconds: 0
              red_high_flash:
                summary: red high flash
                value:
                  color: red
                  brightness: high
                  flash: true
                  seconds: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetStackledResponse'
              example: ''
      security:
      - bearerAuth: []
