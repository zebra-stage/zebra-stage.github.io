<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>IoT Connector REST API (FXR readers)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style id="fxr-dark-mode">
    body { margin: 0; background: #fafafa; }
    @media (prefers-color-scheme: dark) {
      html { color-scheme: dark; background: #1b1f2a; }
      body,
      #swagger-ui,
      .swagger-ui,
      .swagger-ui .wrapper,
      .swagger-ui .scheme-container,
      .swagger-ui .information-container,
      .swagger-ui .opblock,
      .swagger-ui .opblock-body,
      .swagger-ui .opblock-description-wrapper,
      .swagger-ui .opblock-section-header,
      .swagger-ui .responses-inner,
      .swagger-ui .model-box,
      .swagger-ui .model-container {
        background: #1b1f2a !important;
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
        forced-color-adjust: none;
      }
      .swagger-ui,
      .swagger-ui *,
      .swagger-ui *::before,
      .swagger-ui *::after {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
        forced-color-adjust: none;
      }
      .swagger-ui table,
      .swagger-ui table thead,
      .swagger-ui table tbody,
      .swagger-ui table tr,
      .swagger-ui table th,
      .swagger-ui table td,
      .swagger-ui .markdown,
      .swagger-ui .markdown p,
      .swagger-ui .markdown li,
      .swagger-ui .markdown strong,
      .swagger-ui .renderedMarkdown,
      .swagger-ui .renderedMarkdown p,
      .swagger-ui .renderedMarkdown li,
      .swagger-ui .renderedMarkdown strong {
        background: #1b1f2a !important;
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
        border-color: #5b6478 !important;
      }
      .swagger-ui code,
      .swagger-ui .markdown code,
      .swagger-ui .renderedMarkdown code {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
        background: #4a2d63 !important;
      }
      .swagger-ui input,
      .swagger-ui select,
      .swagger-ui textarea {
        background: #232836 !important;
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
        border-color: #5b6478 !important;
      }
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "../FXR_60-90_rest_api.yaml?v=" + Date.now(),
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });
      var dark = document.getElementById("fxr-dark-mode");
      if (dark) document.head.appendChild(dark);
    };
  </script>
</body>
</html>
