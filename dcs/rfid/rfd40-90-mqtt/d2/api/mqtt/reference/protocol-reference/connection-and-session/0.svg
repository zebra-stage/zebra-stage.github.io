"><tspan x="168" dy="0">4 · Add endpoints</tspan><tspan x="168" dy="16.333333">config_endpoint adds CTRL and DATA1,</tspan><tspan x="168" dy="16.333333">and each one connects</tspan></text></g><g class="czU= stage"><g class="shape" ><rect x="0" y="456" width="336" height="94" rx="8" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="168" y="493.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="168" dy="0">5 · First inventory</tspan><tspan x="168" dy="16.333333">control_operation START, tag data</tspan><tspan x="168" dy="16.333333">on the DATA1 topic, then STOP</tspan></text></g><g class="KHMxIC0mZ3Q7IHMyKVswXQ=="><marker id="mk-d2-1247224501-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 168 96 L 168 110" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1247224501-3488378134)" mask="url(#d2-1247224501)" /></g><g class="KHMyIC0mZ3Q7IHMzKVswXQ=="><path d="M 168 210 L 168 224" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1247224501-3488378134)" mask="url(#d2-1247224501)" /></g><g class="KHMzIC0mZ3Q7IHM0KVswXQ=="><path d="M 168 324 L 168 338" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1247224501-3488378134)" mask="url(#d2-1247224501)" /></g><g class="KHM0IC0mZ3Q7IHM1KVswXQ=="><path d="M 168 438 L 168 452" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1247224501-3488378134)" mask="url(#d2-1247224501)" /></g><mask id="d2-1247224501" maskUnits="userSpaceOnUse" x="-9" y="-9" width="354" height="568">
