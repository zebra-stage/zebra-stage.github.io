                                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">X<h4 class="modal-title anchor" id="about-smartdocs"><a class="heading-anchor" href="#about-smartdocs"><span></span></a><i class="fa fa-mobile fa-lg"></i>SmartDocs について</div>
                              <div class="modal-body">
                              <p><br><b>The "SmartDocs" bar can customize this page to show only the features present on a particular Zebra device.<br><b>[SmartDocs] バーでは、特定の Zebra デバイスに存在する機能のみを表示するように、このページをカスタマイズできます。</b><li><b>Use drop-downs to select the OSX, MX and/or Android version<b>ドロップダウンを使用してデバイスの OSX、MX、Android のバージョンを選択</b>するか、デバイスのモデルを選択すると、デバイスでサポートされている機能が強調表示されます。<b>サポートされていない機能は、選択内容に基づいてグレー表示になります</b>。<li><b>SmartDocs Nav works when viewing features of an individual CSP<b>SmartDocs Nav は、個々の CSP の機能を表示するときに機能します</b>。使用するには、CSP (つまり「App Manager」) をクリックし、SmartDocs バーで少なくとも 1 つを選択します。<b><u>サポートされていない機能はグレー表示になります</u>。その CSP でサポートされている機能の間を前後にスクロールさせるには、SmartNav の [進む] ボタンと [前へ] ボタンをクリックします</b> (機能マトリックスでは SmartNav はサポートされていません)。<li><b>To clear all selections</b><b>すべての選択をクリアするには</b>、[SmartDocs] ボタンを押します。</ol>
                              <p></p><p><b>OSX, MX and Android version informationデバイスの <b>OSX、MX および Android のバージョン情報</b>は、Android の設定パネルに表示されるか、ADB、EMDK、または MX CSP を使用してデバイスを照会することで確認できます。<a href="/mx/mx-version-on-device/">詳細情報</a>。<ul>
                                <li><b>The OSX layer</b> provides extensions to the base operating system to implement functionality not offered by Android. The root OSX version number always matches the root number of the Android version that it extends.<b>OSX レイヤー</b>は、Android で提供されていない機能を実装するために、基本オペレーティング システムの拡張機能を提供します。ルート OSX のバージョン番号は、拡張対象とする Android バージョンのルート番号と常に一致します。<a href="/mx/overview/">詳細情報</a>。<li><b>The MX Management System<b>MX 管理システム</b>は、デバイス上の特権および非特権 Android API に対して、統一されたインタフェースを提供します。一部の機能では、MX バージョンと OSX バージョンの特定のペアリングが必要です。<a href="/mx/overview/">詳細情報</a>。<li><b>The Android version</b> is sometimes enough to determine a feature set. Others require a specific MX version plus a minimum version of Android.機能セットを決定するには、<b>Android バージョン</b>で十分な場合があります。また、特定の MX バージョンと Android の最小バージョンが必要になる場合もあります。<li><b>The Device Model</b> indicates which subset of MX features is present in the device.<b>デバイス モデル</b>は、MX 機能のどのサブセットがデバイスに存在するかを示します。</ul>

                          var smartdocOptions = {

                          var parseVersionFloat = function (versionString) {
                              var versionArray = ("" + versionString)
                                      .replace("_", ".")
                                      .replace(/[^0-9.]/g, "")
                                      .split("."),
                                  sum = 0;
                              for (var i = 0; i < versionArray.length; ++i) {
                                  sum += Number(versionArray[i]) / Math.pow(10, i * 3);
                              }
                              // console.log(versionString + " -> " + sum);
                              return sum;
                          }
                          
                            var showelement = function(el,filter){
                              // console.log("Showing");
                              // console.log(el);
                              var filters=["mx","osx","api","devicetype"];
                              var otherhidden = false;
                              //check if something else is hidden element
                              for (var i = 0; i < filters.length; i++) {
                                if(typeof(el.attr('data-filter-'+filters[i])) != 'undefined' && filters[i] != filter){
                                  otherhidden=true;
                                  break;
                                }
                              };
                              if(!otherhidden){
                                // console.log("Not Showing something else has it hidden");
                                  el.removeClass( "not-available" );
                                  el.removeAttr('data-filter');
                              }
                                el.removeAttr('data-filter-'+filter);
                            }
                            var hideelement = function(el,filter){
                              // console.log("Hiding");
                              // console.log(el);
                                el.addClass( "not-available" );
                                el.attr('data-filter-'+filter,"");
                                el.attr('data-filter',"");

                                    // console.log(parseVersionFloat(haveVersion));

                                        // showelement($(this));
                                    }

                                $('[data-api]').each(function() {

                                        // showelement($(this));
                                    }
                        
                                });

                        // SHOW THE SELECTED VERSION

                                    }

                                    else {
                                    
                                    hideelement($(this),'devicetype');
                                    }

                                        var match=false;

                                            if(parseVersionFloat(needVersions[i]) == parseVersionFloat(haveVersion)){

                                            }

                                            }

                                        }
                        
                                    }

                                        }

                                var target = $(filtered[smartdocOptions.index ]);

                            var gotoPrevAvailable = function() {

                              }

                                }

                                }
